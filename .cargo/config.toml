# The only coverage exclusion is `src/main.rs`: process wiring whose bind,
# serve, and shutdown paths are exercised by `tests/lifecycle.rs` and
# `scripts/smoke.sh` instead of unit tests.
[alias]
coverage = "llvm-cov --all-features --workspace --fail-under-lines 95 --ignore-filename-regex crates/.*/src/main.rs$"
