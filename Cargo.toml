[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/iamngoni/veyra"

[workspace.dependencies]
actix-web = "4"
agent-runtime = { git = "https://github.com/iamngoni/agent-runtime", rev = "dd44d81c1914ebb768fa3990e7c291ba08362384" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
# Cargo 1.77+ defaults release builds to `strip = "debuginfo"`; on this
# toolchain (Rust 1.93.1 / macOS 24.4) stripping malforms large proc-macro
# dylibs ("mis-aligned LINKEDIT string pool" when sqlx_macros loads). Keep
# symbols unstripped so `cargo build --release` produces loadable artifacts.
strip = "none"
